<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebR fixed-code example</title>

  <style>
    body {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    pre {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
    }

    button {
      margin: 1rem 0;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .status {
      color: #555;
    }

    canvas {
      max-width: 100%;
      border: 1px solid #ddd;
      margin-top: 1rem;
    }
  </style>
</head>

<body>
  <h1>WebR fixed-code example</h1>

  <p id="status" class="status">Loading WebR...</p>

  <h2>R code</h2>
  <pre><code id="shown-code"></code></pre>

  <button id="run" disabled>Run R</button>

  <h2>Output</h2>
  <pre id="output">(not run yet)</pre>

  <h2>Plots</h2>
  <div id="plots"></div>

  <script type="module">
    import { WebR, ChannelType } from "https://webr.r-wasm.org/latest/webr.mjs";

    /*
      学生に見せるRコードです。
      画面上では <pre><code> に表示するだけで，編集欄は作りません。

      実行時にもDOM上の表示テキストではなく，
      この fixedCode 変数を直接 WebR に渡します。
    */
    const fixedCode = `
set.seed(123)

x <- rnorm(100)

mean(x)
sd(x)

summary(lm(mpg ~ wt + hp, data = mtcars))

hist(
  x,
  breaks = 20,
  main = "Random normal values",
  xlab = "x"
)
`;

    const statusEl = document.getElementById("status");
    const shownCodeEl = document.getElementById("shown-code");
    const runButton = document.getElementById("run");
    const outputEl = document.getElementById("output");
    const plotsEl = document.getElementById("plots");

    shownCodeEl.textContent = fixedCode.trim();

    const webR = new WebR({
      channelType: ChannelType.PostMessage
    });

    statusEl.textContent = "Initializing WebR...";
    await webR.init();

    statusEl.textContent = "WebR is ready.";
    runButton.disabled = false;

    async function formatOutputItem(item) {
      if (typeof item.data === "string") {
        return item.data;
      }

      if (item.data && typeof item.data.toString === "function") {
        try {
          return await item.data.toString();
        } catch {
          return String(item.data);
        }
      }

      return String(item.data);
    }

    runButton.addEventListener("click", async () => {
      runButton.disabled = true;
      outputEl.textContent = "Running...";
      plotsEl.innerHTML = "";

      const shelter = await new webR.Shelter();

      try {
        const result = await shelter.captureR(fixedCode, {
          withAutoprint: true
        });

        const lines = [];

        for (const item of result.output) {
          const text = await formatOutputItem(item);
          lines.push(text);
        }

        outputEl.textContent = lines.join("\n").trim() || "(no text output)";

        for (const image of result.images) {
          const canvas = document.createElement("canvas");
          canvas.width = image.width;
          canvas.height = image.height;

          const context = canvas.getContext("2d");
          context.drawImage(image, 0, 0);

          plotsEl.appendChild(canvas);
        }
      } catch (error) {
        outputEl.textContent = String(error?.message ?? error);
      } finally {
        await shelter.purge();
        runButton.disabled = false;
      }
    });
  </script>
</body>
</html>
