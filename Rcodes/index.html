<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebR on GitHub Pages</title>
  <style>
    body {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      padding: 0.8rem;
      box-sizing: border-box;
    }

    button {
      margin: 1rem 0;
      padding: 0.6rem 1rem;
      font-size: 1rem;
    }

    pre {
      background: #f6f8fa;
      padding: 1rem;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    canvas {
      max-width: 100%;
      border: 1px solid #ddd;
      margin-top: 1rem;
    }

    .status {
      color: #555;
    }
  </style>
</head>
<body>
  <h1>WebR on GitHub Pages</h1>

  <p class="status" id="status">Loading WebR...</p>

  <textarea id="code">x <- rnorm(1000)

mean(x)
sd(x)

summary(lm(mpg ~ wt + hp, data = mtcars))

hist(x, breaks = 30, main = "Random normal values")</textarea>

  <br />
  <button id="run" disabled>Run R</button>

  <h2>Output</h2>
  <pre id="output"></pre>

  <h2>Plots</h2>
  <div id="plots"></div>

  <script type="module">
    import { WebR, ChannelType } from "https://webr.r-wasm.org/latest/webr.mjs";

    const statusEl = document.getElementById("status");
    const codeEl = document.getElementById("code");
    const runButton = document.getElementById("run");
    const outputEl = document.getElementById("output");
    const plotsEl = document.getElementById("plots");

    const webR = new WebR({
      channelType: ChannelType.PostMessage
    });

    statusEl.textContent = "Initializing WebR...";
    await webR.init();

    statusEl.textContent = "WebR is ready.";
    runButton.disabled = false;

    runButton.addEventListener("click", async () => {
      runButton.disabled = true;
      outputEl.textContent = "Running...";
      plotsEl.innerHTML = "";

      const shelter = await new webR.Shelter();

      try {
        const result = await shelter.captureR(codeEl.value, {
          withAutoprint: true
        });

        const textOutput = result.output
          .map((item) => {
            if (typeof item.data === "string") {
              return item.data;
            }
            return String(item.data);
          })
          .join("\n");

        outputEl.textContent = textOutput || "(no text output)";

        for (const image of result.images) {
          const canvas = document.createElement("canvas");
          canvas.width = image.width;
          canvas.height = image.height;
          canvas.getContext("2d").drawImage(image, 0, 0);
          plotsEl.appendChild(canvas);
        }
      } catch (error) {
        outputEl.textContent = String(error?.message ?? error);
      } finally {
        await shelter.purge();
        runButton.disabled = false;
      }
    });
  </script>
</body>
</html>
